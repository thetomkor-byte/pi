<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="referrer" content="no-referrer" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, nocache" />
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
<meta name="google" content="notranslate" />
<meta name="bingbot" content="noindex, nofollow, noarchive" />
<meta name="yandex" content="noindex, nofollow, noarchive" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no" />
<meta name="theme-color" content="#000000" />
<meta name="copyright" content="All rights reserved" />
<title>Poker Trainer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #000000;
  --bg-bottom: #000000;
  --gold: #ffcb2b;
  --gold-2: #e0a800;
  --text: #e8eef5;
  --muted: #8a8a8a;
  --muted-soft: #9a9a9a;
  --muted-soft-2: #a8a8a8;
  --accent: #3fa9f5;
  --danger: #d94f3d;
  --ok: #2fb571;
  --allin: #e63946;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --board-card-w: clamp(34px, 5.2vmin, 48px);
  --board-card-h: clamp(48px, 7.3vmin, 67px);
  --edge: clamp(6px, 1.1vmin, 10px);
  --pct-block-w: clamp(88px, 13vmin, 110px);
  --dash-inset: clamp(10px, 2vmin, 18px);
  --small-text: clamp(11px, 1.4vmin, 13px);
  --info-row-text: clamp(11px, 1.5vmin, 14px);
  --place-text: clamp(12px, 1.6vmin, 15px);

  --nav-btn: clamp(32px, 4.4vmin, 38px);
  --nav-icon-size: clamp(16px, 2.4vmin, 19px);
  --nav-gap: clamp(1px, 0.5vmin, 4px);
  --nav-counter-w: clamp(44px, 6.2vmin, 54px);
  --nav-counter-size: clamp(12px, 1.6vmin, 14px);

  --table-radius: clamp(28px, 4vmin, 46px);
  --table-border-w: clamp(8px, 1.4vmin, 14px);

  --hero-timer-size: clamp(40px, 5.6vmin, 52px);
  --support-btn-h: clamp(28px, 3.6vmin, 34px);
  --support-btn-fs: clamp(10px, 1.3vmin, 12px);

  --belcard-offset: 8px;
  --belcard-lift: 8px;

  --table-col-w: min(94vw, calc((100vh - clamp(8px, 1.6vmin, 20px)) * 9 / 16));

  --champ-size: min(65%, 323px);
}

html, body {
  height: 100%;
  background: var(--bg-bottom);
  color: var(--text);
  font-family: "Inter", "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  overscroll-behavior: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
}

html {
  -ms-touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
  -moz-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  text-size-adjust: 100%;
  background: var(--bg-bottom);
}

body {
  -webkit-text-size-adjust: 100%;
  -moz-text-size-adjust: 100%;
  text-size-adjust: 100%;
  -ms-touch-action: manipulation;
  background: var(--bg-bottom);
}

button { cursor: pointer; }
button:disabled { cursor: default; }
button:disabled,
button.disabled {
  cursor: default;
}

#hero-actions.inactive,
#hero-actions.inactive *,
#hero-actions.inactive input,
#hero-actions.inactive input::-webkit-slider-thumb,
#hero-actions.inactive input::-moz-range-thumb,
#hero-actions.inactive input::-webkit-slider-runnable-track,
#hero-actions.inactive input::-moz-range-track,
#quick-percent-list.inactive,
#quick-percent-list.inactive * {
  cursor: default !important;
}

#hand-nav button { cursor: pointer !important; }
#hand-nav button:disabled { cursor: default !important; }

#app {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg-bottom);
}

#table-scene {
  position: absolute;
  top: calc(var(--safe-top) + 2px);
  left: 0; right: 0;
  bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
}

#poker-table-wood {
  position: relative;
  aspect-ratio: 9 / 16;
  height: calc(100% - clamp(8px, 1.6vmin, 20px));
  width: auto;
  max-width: 94vw;
  background: linear-gradient(180deg, #6b4622 0%, #3d2512 40%, #2a1a0c 100%);
  border-radius: var(--table-radius);
  box-shadow:
    0 0 0 3px #1a0f05,
    0 0 60px rgba(0,0,0,.95);
  padding: var(--table-border-w);
  box-sizing: border-box;
}

#poker-table {
  position: relative;
  width: 100%;
  height: 100%;
  background:
    radial-gradient(ellipse at 50% 45%, #322c26 0%, #1e1a16 55%, #0f0d0b 100%);
  border-radius: calc(var(--table-radius) - var(--table-border-w) + 2px);
  box-shadow:
    inset 0 0 140px rgba(0,0,0,.7);
  overflow: hidden;
}

#board-area {
  position: absolute;
  top: calc(46% - 8px); left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: none;
  z-index: 5;
  width: 72%;
  max-width: 72%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

#place-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  color: var(--text);
  font-weight: 700;
  text-shadow: 0 1px 4px rgba(0,0,0,.95);
  letter-spacing: .3px;
  white-space: nowrap;
  opacity: 0.45;
  pointer-events: none;
  text-align: center;
  width: 100%;
}
#place-center.hidden { display: none; }
#place-center .place-line,
#place-center .heads-up-line {
  font-size: var(--place-text);
  line-height: 1.3;
  min-height: 1.3em;
}
#place-center .heads-up-line.hidden { display: none; }

#swipe-center {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 66%;
  height: 40%;
  z-index: 4;
  touch-action: pan-y;
  pointer-events: auto;
  background: transparent;
}

#top-info {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(2px, 0.4vmin, 4px);
  margin-bottom: 0;
  width: 100%;
}

#pot-display {
  color: var(--gold);
  font-weight: 800;
  font-size: clamp(16px, 2.4vmin, 24px);
  text-shadow: 0 2px 8px rgba(0,0,0,.95), 0 0 18px rgba(255,203,43,.25);
  letter-spacing: .3px;
  white-space: nowrap;
}

#board-cards-wrap {
  position: relative;
  margin-bottom: 0;
  height: var(--board-card-h);
  width: calc(var(--board-card-w) * 5 + clamp(3px, 0.6vmin, 5px) * 4);
  max-width: 100%;
}

#board-brand-label {
  position: absolute;
  top: 5px;
  bottom: 5px;
  left: 0px;
  right: 0px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-weight: 900;
  font-size: clamp(20px, 3.2vmin, 32px);
  letter-spacing: 0;
  color: rgba(255, 255, 255, 0.2);
  text-shadow:
    0 -1px 0 rgba(255, 255, 255, 0.05),
    0 1px 1px rgba(0, 0, 0, 0.85),
    inset 0 1px 2px rgba(0, 0, 0, 0.9);
  text-transform: uppercase;
  pointer-events: none;
  user-select: none;
  white-space: nowrap;
  z-index: 0;
  line-height: 1;
  overflow: hidden;
  transform: scaleY(1.5);
  transform-origin: center center;
}

#board-cards {
  position: absolute;
  inset: 0;
  display: flex;
  gap: clamp(3px, 0.6vmin, 5px);
  justify-content: center;
  align-items: center;
  z-index: 1;
}
#board-cards .card {
  --card-w: var(--board-card-w);
  --card-h: var(--board-card-h);
  font-size: clamp(20px, 3.2vmin, 30px);
  padding: 1px 4px;
}
#board-cards .card .suit { font-size: clamp(24px, 3.8vmin, 36px); }

#board-cards .card.dimmed {
  position: relative;
}
#board-cards .card.dimmed::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(15, 13, 11, 0.65);
  border-radius: inherit;
  pointer-events: none;
  z-index: 2;
}

#table-info {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: var(--info-row-text);
  color: var(--text);
  font-weight: 700;
  text-shadow: 0 1px 4px rgba(0,0,0,.95);
  letter-spacing: .3px;
  width: 100%;
}
#table-info .info-row {
  white-space: nowrap;
  line-height: 1.3;
  min-height: 1.3em;
}
#table-info .info-row.faded { opacity: 0.45; }

#bottom-support-slot {
  position: relative;
  width: 100%;
  min-height: calc(var(--hero-timer-size) - 8px + 6px);
  margin-top: 6px;
  pointer-events: none;
}

#bottom-support-btn {
  position: absolute;
  left: 50%;
  top: 0;
  transform: translateX(-50%);
  width: calc(var(--hero-timer-size) - 8px);
  height: calc(var(--hero-timer-size) - 8px);
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #3a3530, #1a1a1a 70%);
  border: 1px solid #8a6508;
  color: var(--gold);
  font-weight: 900;
  font-size: clamp(18px, 2.4vmin, 22px);
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform .18s ease, filter .08s ease;
  font-family: inherit;
  padding: 0;
  pointer-events: auto;
  opacity: 0.7;
  flex-shrink: 0;
}
#bottom-support-btn:active:not(:disabled) {
  filter: brightness(1.35);
}

#hands-history-float {
  position: absolute;
  left: 50%;
  transform: translate(-50%, -50%);
  display: none;
  align-items: center;
  justify-content: center;
  font-size: var(--place-text);
  color: #a8a8a8;
  font-weight: 700;
  letter-spacing: .3px;
  line-height: 1.3;
  white-space: nowrap;
  pointer-events: auto;
  cursor: pointer;
  touch-action: manipulation;
  text-shadow: 0 1px 4px rgba(0,0,0,.95);
  z-index: 6;
}
#hands-history-float.visible { display: flex; }
#hands-history-float.pressed { color: #d0d0d0; }
#hands-history-float.pressed .hh-copy-icon::before,
#hands-history-float.pressed .hh-copy-icon::after { border-color: #d0d0d0; }

#hands-history-label {
  position: relative;
  display: inline-block;
}

.hh-copy-icon {
  position: absolute;
  left: 100%;
  margin-left: 6px;
  top: 50%;
  transform: translateY(-50%);
  width: 6px;
  height: 6px;
  pointer-events: none;
}
.hh-copy-icon::before,
.hh-copy-icon::after {
  content: "";
  position: absolute;
  border: 1px solid #a8a8a8;
  border-radius: 1px;
  background: transparent;
}
.hh-copy-icon::before {
  width: 4px;
  height: 4px;
  left: 0;
  top: 2px;
}
.hh-copy-icon::after {
  width: 4px;
  height: 4px;
  left: 2px;
  top: 0;
}

#hands-history-copied {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: 100%;
  margin-bottom: 2px;
  font-size: var(--info-row-text);
  color: #a8a8a8;
  font-weight: 700;
  letter-spacing: .3px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s ease;
}
#hands-history-copied.visible { opacity: 1; }

.card {
  width: var(--card-w);
  height: var(--card-h);
  background: #fafafa;
  border-radius: clamp(4px, 0.6vmin, 7px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  padding: 1px 3px;
  font-weight: 800;
  font-size: clamp(20px, 3vmin, 30px);
  box-shadow:
    0 3px 8px rgba(0,0,0,.7),
    inset 0 0 0 1px rgba(0,0,0,.08);
  position: relative;
  flex-shrink: 0;
  line-height: 1;
}
.card .rank { line-height: 1; }
.card .suit { line-height: 1; font-size: clamp(24px, 3.6vmin, 36px); }

.card.back {
  background:
    repeating-linear-gradient(45deg,
      #1a2540 0px, #1a2540 3px,
      #243255 3px, #243255 6px);
  border: 1px solid #0a1225;
}
.card.back::after {
  content: "";
  position: absolute;
  inset: 5px;
  border: 1px solid rgba(255,203,43,.28);
  border-radius: clamp(2px, 0.4vmin, 3px);
  background:
    radial-gradient(circle at 30% 30%, rgba(255,203,43,.22) 0%, transparent 55%),
    radial-gradient(circle at center, rgba(255,203,43,.15) 0%, transparent 60%);
}

.style-4color .suit-spades   { color: #1a1a1a; }
.style-4color .suit-hearts   { color: #d63535; }
.style-4color .suit-diamonds { color: #2b6dd6; }
.style-4color .suit-clubs    { color: #1fa04a; }

.style-2color .suit-spades   { color: #1a1a1a; }
.style-2color .suit-clubs    { color: #1a1a1a; }
.style-2color .suit-hearts   { color: #d63535; }
.style-2color .suit-diamonds { color: #d63535; }

#seats { position: absolute; inset: 0; }

.seat {
  position: absolute;
  width: clamp(72px, 11%, 120px);
  transform: translate(-50%, -50%);
  text-align: center;
  font-size: 14px;
  z-index: 10;
  pointer-events: none;
}
.seat.eliminated { display: none; }

.seat .strat-badge {
  position: absolute;
  top: calc(clamp(-22px, -3vmin, -18px) - 2px);
  left: 50%;
  transform: translateX(-50%);
  color: #fff;
  font-size: clamp(9px, 1.2vmin, 11px);
  font-weight: 800;
  padding: 3px 8px 5px 8px;
  border-radius: 4px;
  letter-spacing: .5px;
  white-space: nowrap;
  z-index: 15;
  transition: opacity .2s;
  text-shadow: 0 1px 2px rgba(0,0,0,.55);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15);
  line-height: 1;
}
.seat .strat-badge.hidden { display: none; }
.seat.folded .strat-badge { opacity: 0.35; }

.seat .strat-badge.pro-gto      { background: #311f3b; }
.seat .strat-badge.pro-solver   { background: #2f1a3b; }
.seat .strat-badge.pro-icm      { background: #2c123b; }
.seat .strat-badge.pro-lag      { background: #290a3b; }

.seat .strat-badge.vip-taglite  { background: #062a0a; }
.seat .strat-badge.vip-loose    { background: #0e2f12; }
.seat .strat-badge.vip-rock     { background: #13311a; }
.seat .strat-badge.vip-maniac   { background: #18331b; }

.seat .seat-cards {
  display: flex;
  gap: clamp(4px, 0.9vmin, 7px);
  justify-content: center;
  min-height: 0;
  margin-bottom: clamp(3px, 0.6vmin, 5px);
  position: relative;
  pointer-events: auto;
  touch-action: manipulation;
}

.seat .seat-cards .card {
  --card-w: clamp(32px, 4.6vmin, 44px);
  --card-h: clamp(45px, 6.5vmin, 62px);
  font-size: clamp(20px, 3vmin, 30px);
  padding: 1px 3px;
  border-radius: clamp(4px, 0.6vmin, 6px);
}
.seat .seat-cards .card .suit { font-size: clamp(24px, 3.6vmin, 36px); }

.seat.hero .seat-cards .card {
  --card-w: clamp(37.8px, 5.58vmin, 48.6px);
  --card-h: clamp(53.1px, 7.83vmin, 68.4px);
  font-size: clamp(21.6px, 3.42vmin, 30.6px);
  box-shadow:
    0 0 0 1.5px rgba(255,203,43,.55),
    0 3px 10px rgba(0,0,0,.75);
}
.seat.hero .seat-cards .card .suit { font-size: clamp(25.2px, 3.96vmin, 36px); }

.seat .pos-row {
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 3px;
  position: relative;
}
.seat .pos-name {
  font-weight: 900;
  font-size: clamp(12px, 1.8vmin, 16px);
  color: var(--gold);
  letter-spacing: .5px;
  text-shadow: 0 1px 3px rgba(0,0,0,.95);
  position: relative;
  display: inline-block;
  padding: 0 2px;
}
.seat.active .pos-name {
  color: #fff;
  text-shadow: 0 0 10px var(--gold), 0 1px 3px rgba(0,0,0,.95);
}

.seat .dealer-chip {
  position: absolute;
  width: clamp(16px, 2.2vmin, 20px);
  height: clamp(16px, 2.2vmin, 20px);
  background: radial-gradient(circle at 35% 35%, #fff6d0, #ffcb2b 60%, #b8860b);
  color: #1a1a1a;
  font-size: clamp(9px, 1.2vmin, 11px);
  font-weight: 900;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 1px 4px rgba(0,0,0,.7);
  border: 1px solid #8a6508;
  z-index: 16;
}
.seat .dealer-chip.hidden { display: none; }

.seat.left .dealer-chip { right: clamp(-26px, -3.4vmin, -22px); top: 28px; left: auto; }
.seat.right .dealer-chip,
.seat.top .dealer-chip { left: clamp(-26px, -3.4vmin, -22px); top: 28px; right: auto; }
.seat.hero .dealer-chip {
  top: clamp(-30px, -3.8vmin, -24px);
  left: 50%;
  right: auto;
  transform: translateX(-50%);
}

@media (min-width: 768px) {
  .seat.left .dealer-chip {
    right: calc(clamp(-26px, -3.4vmin, -22px) - 6px);
  }
  .seat.right .dealer-chip,
  .seat.top .dealer-chip {
    left: calc(clamp(-26px, -3.4vmin, -22px) - 6px);
  }
}

.seat .stack-wrap {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
}
.seat .stack {
  color: var(--text);
  font-weight: 700;
  font-size: clamp(12px, 1.6vmin, 14px);
  text-shadow: 0 1px 3px rgba(0,0,0,.95);
  position: relative;
  display: inline-block;
  pointer-events: auto;
  touch-action: manipulation;
}

.seat .delta-text {
  position: absolute;
  font-size: clamp(11px, 1.4vmin, 13px);
  font-weight: 500;
  white-space: nowrap;
  text-shadow: 0 1px 3px rgba(0,0,0,.95);
  pointer-events: none;
  z-index: 20;
}
.seat .delta-text.hidden { display: none; }
.seat .delta-text.positive { color: #4ae08a; }
.seat .delta-text.negative { color: #e05a4a; }

.seat.left .delta-text {
  left: 100%;
  margin-left: 1px;
  top: 50%;
  transform: translateY(calc(-50% - 1px));
}
.seat.right .delta-text {
  right: 100%;
  margin-right: 1px;
  top: 50%;
  transform: translateY(calc(-50% - 1px));
}
.seat.top .delta-text {
  left: 100%;
  margin-left: 0px;
  top: 50%;
  transform: translateY(calc(-50% - 1px));
}
.seat.hero .delta-text {
  top: auto;
  transform: translateY(-1px);
  left: 100%;
  margin-left: 0px;
  bottom: auto;
  top: calc(-1 * clamp(16px, 2.2vmin, 22px));
}

.seat.active .seat-cards .card {
  box-shadow:
    0 0 12px rgba(255,203,43,.7),
    0 3px 8px rgba(0,0,0,.7);
}
.seat.folded { opacity: .35; }

.seat.winner .seat-cards .card {
  box-shadow:
    0 0 0 1.5px rgba(255,203,43,.85),
    0 0 14px 3px rgba(255,203,43,.6),
    0 3px 8px rgba(0,0,0,.7);
}

.seat .action-badge {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.9);
  color: var(--text);
  font-size: clamp(9px, 1.2vmin, 11px);
  font-weight: 800;
  padding: 4px 10px;
  border-radius: 4px;
  white-space: nowrap;
  border: 1px solid #3a3530;
  z-index: 22;
  text-transform: uppercase;
  letter-spacing: .5px;
  bottom: clamp(-26px, -3.2vmin, -22px);
  top: auto;
}
.seat .action-badge.fold  { color: #ff8a7a; border-color: #5a2a25; }
.seat .action-badge.call  { color: #7ab8ff; border-color: #25445a; }
.seat .action-badge.raise { color: var(--gold); border-color: #5a4a1a; }
.seat .action-badge.check { color: #7ae5a0; border-color: #255a35; }
.seat .action-badge.allin { color: var(--allin); border-color: #5a2028; }
.seat .action-badge.hidden { display: none; }

.seat .winner-badge {
  position: absolute;
  left: 50%;
