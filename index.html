    { x: 14, y: 56, side: 'left'   },
    { x: 14, y: 32, side: 'left'   },
    { x: 14, y: 9,  side: 'left'   },
    { x: 50, y: 9,  side: 'top'    },
    { x: 86, y: 9,  side: 'right'  },
    { x: 86, y: 32, side: 'right'  },
    { x: 86, y: 56, side: 'right'  }
  ];

  const SUIT_CLASS = { s: 'suit-spades', h: 'suit-hearts', d: 'suit-diamonds', c: 'suit-clubs' };
  const SUIT_SYMBOL = { s: '♠', h: '♥', d: '♦', c: '♣' };
  const RANK_DISPLAY = { T: '10' };

  function init() {
    el.seats          = document.getElementById('seats');
    el.boardCards     = document.getElementById('board-cards');
    el.potDisplay     = document.getElementById('pot-display');
    el.infoBlindsRow  = document.getElementById('info-blinds-row');
    el.infoTimerRow   = document.getElementById('info-timer-row');
    el.infoNextBlinds = document.getElementById('info-next-blinds-row');

    el.heroActions    = document.getElementById('hero-actions');
    el.heroButtons    = document.getElementById('hero-buttons');
    el.sliderHoriz    = document.getElementById('raise-slider-horiz');
    el.raiseAmountMini= document.getElementById('raise-amount-mini');
    el.quickPercentList = document.getElementById('quick-percent-list');
    el.btnFold        = document.getElementById('btn-fold');
    el.btnCheck       = document.getElementById('btn-check');
    el.btnCall        = document.getElementById('btn-call');
    el.callAmount     = document.getElementById('call-amount');

    el.bottomPanel    = document.getElementById('bottom-panel');
    el.tapClose       = document.getElementById('tap-close');

    el.hnPrev         = document.getElementById('hn-prev');
    el.hnNext         = document.getElementById('hn-next');
    el.hnCur          = document.getElementById('hn-cur');
    el.hnTot          = document.getElementById('hn-tot');
    el.hnResume       = document.getElementById('hn-resume');
    el.hnReset        = document.getElementById('hn-reset');
    el.hnSettings     = document.getElementById('hn-settings');

    el.setCardStyle      = document.getElementById('set-card-style');
    el.setStackDisplay   = document.getElementById('set-stack-display');
    el.setBlindGrowth    = document.getElementById('set-blind-growth');
    el.setTurnTime       = document.getElementById('set-turn-time');
    el.setShowStrategies = document.getElementById('set-show-strategies');
    el.setShowAllHands   = document.getElementById('set-show-all-hands');
    el.setShowAllShowdown = document.getElementById('set-show-all-showdown');

    el.startOverlay   = document.getElementById('start-overlay');
    el.btnStart       = document.getElementById('btn-start');

    applyCardStyle();
    applySettingsToUI();
  }

  function updateOverlayState() {
    const anyOpen = el.bottomPanel.classList.contains('open');
    el.tapClose.classList.toggle('active', anyOpen);
  }

  function openBottomPanel() {
    el.bottomPanel.classList.add('open');
    updateOverlayState();
  }
  function closeBottomPanel() {
    el.bottomPanel.classList.remove('open');
    updateOverlayState();
  }
  function closeAllPanels() {
    el.bottomPanel.classList.remove('open');
    updateOverlayState();
  }

  function renderTable(state) {
    el.seats.innerHTML = '';
    for (const p of state.players) el.seats.appendChild(createSeatElement(p, state));
    updateStacks(state);
    updatePot(state);
    updateLevel(state);
  }

  function createSeatElement(player, state) {
    const pos = SEAT_POSITIONS[player.seatIndex] || { x: 50, y: 50, side: 'middle' };
    const seat = document.createElement('div');
    seat.className = 'seat';
    seat.id = `seat-${player.id}`;
    seat.style.left = pos.x + '%';
    seat.style.top  = pos.y + '%';
    if (player.isHero) {
      seat.style.transform = 'translate(-50%, calc(-50% - 16px))';
    } else if (player.seatIndex === 1) {
      seat.style.transform = 'translate(-50%, calc(-50% - 1px))';
    } else if (player.seatIndex === 2) {
      seat.style.transform = 'translate(-50%, calc(-50% + 4px))';
    } else if (player.seatIndex === 6) {
      seat.style.transform = 'translate(-50%, calc(-50% + 3px))';
    } else if (player.seatIndex === 7) {
      seat.style.transform = 'translate(-50%, calc(-50% + 1px))';
    } else {
      seat.style.transform = 'translate(-50%, calc(-50% + 2px))';
    }
    if (pos.side) seat.classList.add(pos.side);
    if (player.isHero) seat.classList.add('hero');

    // Ключевое правило: если игрок вылетел ДО начала текущей раздачи
    // (был eliminated уже на момент старта раздачи) — место полностью
    // скрыто и не рисуется. Если игрок вылетел ВО ВРЕМЯ раздачи —
    // место видимо, чтобы показать, как он вылетел.
    const wasEliminatedBeforeHand = player.eliminated && !player.inHand;
    if (wasEliminatedBeforeHand) {
      seat.classList.add('eliminated');
    }

    if (player.isHero || pos.side === 'top') {
      seat.innerHTML = `
        <div class="strat-badge hidden" data-role="strat"></div>
        <div class="dealer-chip hidden" data-role="btn">D</div>
        <div class="seat-cards" data-role="cards"></div>
        <div class="pos-row">
          <span class="pos-name" data-role="pos">—</span>
        </div>
        <div class="stack-wrap">
          <span class="stack" data-role="stack"></span>
          <span class="delta-text hidden" data-role="delta"></span>
        </div>
        <div class="action-badge hidden" data-role="action"></div>
        <div class="winner-badge hidden" data-role="winner">WIN</div>
        <div class="bet-chips hidden" data-role="bet"></div>
      `;
    } else {
      seat.innerHTML = `
        <div class="strat-badge hidden" data-role="strat"></div>
        <div class="dealer-chip hidden" data-role="btn">D</div>
        <div class="seat-cards" data-role="cards"></div>
        <div class="pos-row">
          <span class="pos-name" data-role="pos">—</span>
          <span class="delta-text hidden" data-role="delta"></span>
        </div>
        <div class="stack-wrap">
          <span class="stack" data-role="stack"></span>
        </div>
        <div class="action-badge hidden" data-role="action"></div>
        <div class="winner-badge hidden" data-role="winner">WIN</div>
        <div class="bet-chips hidden" data-role="bet"></div>
      `;
    }
    return seat;
  }

  function updateSeats(state, revealAll) {
    for (const p of state.players) {
      const seat = document.getElementById(`seat-${p.id}`);
      if (!seat) continue;

      // Место скрыто только если игрок вылетел ДО этой раздачи (не участвовал в ней).
      const wasEliminatedBeforeHand = p.eliminated && !p.inHand;
      if (wasEliminatedBeforeHand) {
        seat.classList.add('eliminated');
        continue;
      } else {
        seat.classList.remove('eliminated');
      }

      seat.querySelector('[data-role="pos"]').textContent = p.position || '—';
      seat.classList.toggle('folded', p.folded && !p.eliminated);

      const btn = seat.querySelector('[data-role="btn"]');
      if (p.position === 'BTN') btn.classList.remove('hidden');
      else btn.classList.add('hidden');

      const stratBadge = seat.querySelector('[data-role="strat"]');
      if (settings.showStrategies && p.strategy && !p.isHero) {
        stratBadge.textContent = p.strategy;
        stratBadge.classList.remove('hidden');
      } else stratBadge.classList.add('hidden');

      renderSeatCards(p, state, revealAll);

      const betEl = seat.querySelector('[data-role="bet"]');
      if (p.committedThisStreet > 0 && !p.folded && !state.handOver) {
        betEl.textContent = formatChips(p.committedThisStreet, state);
        betEl.classList.remove('hidden');
      } else betEl.classList.add('hidden');

      renderActionBadge(p, seat);
      renderWinnerBadge(p, seat, state);
      renderDelta(p, seat, state);
    }
    updateStacks(state);
    updateActiveHighlight(state);
  }

  function renderActionBadge(p, seat) {
    const badge = seat.querySelector('[data-role="action"]');
    if (!p.lastAction || p.lastAction === 'sb' || p.lastAction === 'bb') {
      badge.classList.add('hidden');
      return;
    }
    const map = { fold:'FOLD', check:'CHECK', call:'CALL', raise:'RAISE', allin:'ALL-IN' };
    const cls = { fold:'fold', check:'check', call:'call', raise:'raise', allin:'allin' };
    badge.textContent = map[p.lastAction] || p.lastAction.toUpperCase();
    badge.className = 'action-badge ' + (cls[p.lastAction] || '');
  }

  function renderWinnerBadge(p, seat, state) {
    const badge = seat.querySelector('[data-role="winner"]');
    if (!badge) return;

    if (!state.handOver || !state.showdownResults) {
      badge.classList.add('hidden');
      return;
    }

    const payouts = state.showdownResults.payouts || {};
    const payout = payouts[p.id] || 0;
    const committed = p.committedTotal || 0;

    if (payout > 0) {
      badge.textContent = 'WIN';
      badge.classList.remove('hidden');
      badge.classList.add('win');
      badge.classList.remove('loss');
    } else if (committed > 0) {
      badge.textContent = 'LOSS';
      badge.classList.remove('hidden');
      badge.classList.add('loss');
      badge.classList.remove('win');
    } else {
      badge.classList.add('hidden');
    }
  }

  function renderDelta(p, seat, state) {
    const deltaEl = seat.querySelector('[data-role="delta"]');
    if (!deltaEl) return;

    if (!state.handOver || !state.showdownResults) {
      deltaEl.classList.add('hidden');
      return;
    }

    const payouts = state.showdownResults.payouts || {};
    const payout = payouts[p.id] || 0;
    const committed = p.committedTotal || 0;

    if (payout > 0) {
      const net = payout - committed;
      deltaEl.textContent = '+' + formatChips(net, state);
      deltaEl.classList.remove('hidden');
      deltaEl.classList.add('positive');
      deltaEl.classList.remove('negative');
    } else if (committed > 0) {
      deltaEl.textContent = '−' + formatChips(committed, state);
      deltaEl.classList.remove('hidden');
      deltaEl.classList.add('negative');
      deltaEl.classList.remove('positive');
    } else {
      deltaEl.classList.add('hidden');
    }
  }

  function renderSeatCards(player, state, revealAll) {
    const seat = document.getElementById(`seat-${player.id}`);
    if (!seat) return;
    const cardsEl = seat.querySelector('[data-role="cards"]');
    cardsEl.innerHTML = '';
    if (player.holeCards.length === 0) return;

    let show;
    if (settings.showAllHands) {
      show = true;
    } else if (state.handOver) {
      if (settings.showAllShowdown && revealAll) {
        show = true;
      } else {
        show = (player.committedTotal > 0) || player.isHero || player.revealed;
      }
    } else {
      show = revealAll || player.isHero || player.revealed;
    }

    if (show) {
      for (const c of player.holeCards) cardsEl.appendChild(createCardElement(c));
    } else if (!player.folded || player.eliminated) {
      for (let i = 0; i < player.holeCards.length; i++) cardsEl.appendChild(createCardBack());
    } else {
      for (let i = 0; i < player.holeCards.length; i++) {
        const cb = createCardBack();
        cb.style.opacity = '0.35';
        cardsEl.appendChild(cb);
      }
    }
  }

  function updateStacks(state) {
    for (const p of state.players) {
      const seat = document.getElementById(`seat-${p.id}`);
      if (!seat) continue;
      const stackEl = seat.querySelector('[data-role="stack"]');
      if (stackEl) stackEl.textContent = formatChips(p.stack, state);
    }
  }

  function updateActiveHighlight(state) {
    for (const p of state.players) {
      const seat = document.getElementById(`seat-${p.id}`);
      if (!seat || p.eliminated) continue;
      const isActing = state.actingIndex === p.seatIndex && !state.handOver && !p.folded;
      seat.classList.toggle('active', isActing);
    }
  }

  function updateBoard(state) {
    el.boardCards.innerHTML = '';
    const actualCount = state.board.length;
    const finalStreet = state.finalStreet;

    let liveCount;
    if (!state.handOver || !finalStreet) {
      liveCount = actualCount;
    } else {
      switch (finalStreet) {
        case 'preflop': liveCount = 0; break;
        case 'flop':    liveCount = 3; break;
        case 'turn':    liveCount = 4; break;
        case 'river':   liveCount = 5; break;
        default:        liveCount = actualCount;
      }
    }

    for (let i = 0; i < actualCount; i++) {
      const c = createCardElement(state.board[i]);
      if (state.handOver && i >= liveCount) {
        c.style.opacity = '0.35';
      }
      el.boardCards.appendChild(c);
    }
  }

  function updatePot(state) {
    el.potDisplay.textContent = 'Банк: ' + formatChips(state.pot, state);
  }

  function updateLevel(state) {
    const b = state.blinds || Engine.getBlindLevel(state.levelIndex);
    const anteStr = b.ante > 0 ? '   Анте: ' + b.ante : '';
    el.infoBlindsRow.textContent = `Блайнды: ${b.sb}/${b.bb}${anteStr}`;

    const period = settings.blindGrowthHands || 10;
    const left = period - (state.handsAtLevel || 0);
    el.infoTimerRow.textContent = `через ${left} раздач`;
    const nextIdx = Math.min(state.levelIndex + 1, Engine.BLIND_LEVELS.length - 1);
    const next = Engine.BLIND_LEVELS[nextIdx];
    const nextAnte = next.ante > 0 ? ` (${next.ante})` : '';
    el.infoNextBlinds.textContent = `${next.sb}/${next.bb}${nextAnte}`;
  }

  function createCardElement(card) {
    const c = document.createElement('div');
    c.className = 'card';
    const suitClass = SUIT_CLASS[card.suit] || '';
    const suitSym   = SUIT_SYMBOL[card.suit] || '?';
    const rankTxt   = RANK_DISPLAY[card.rank] || card.rank;
    c.classList.add(suitClass);
    c.innerHTML = `<div class="rank">${rankTxt}</div><div class="suit">${suitSym}</div>`;
    return c;
  }

  function createCardBack() {
    const c = document.createElement('div');
    c.className = 'card back';
    return c;
  }

  function applyCardStyle() {
    document.body.classList.remove('style-4color', 'style-2color');
    document.body.classList.add('style-' + settings.cardStyle);
  }

  function formatChips(amount, state) {
    if (settings.stackDisplay === 'bb') {
      const bb = (state.blinds && state.blinds.bb) || Engine.getBlindLevel(state.levelIndex).bb;
      const bbVal = amount / bb;
      return bbVal.toFixed(bbVal >= 10 ? 0 : 1) + ' BB';
    }
    return amount.toLocaleString('ru-RU');
  }

  function setHeroActionsActive(active) {
    el.heroActions.classList.toggle('inactive', !active);
    el.quickPercentList.classList.toggle('inactive', !active);

    const slider = document.getElementById('raise-slider-horiz');
    if (slider) {
      if (!active) {
        slider.disabled = true;
        slider.classList.remove('pressed');
      } else {
        slider.disabled = false;
      }
    }

    if (el.btnFold)  el.btnFold.disabled  = el.btnFold.disabled  || !active;
    if (el.btnCheck) el.btnCheck.disabled = el.btnCheck.disabled || !active;
    if (el.btnCall)  el.btnCall.disabled  = el.btnCall.disabled  || !active;

    if (el.quickPercentList) {
      el.quickPercentList.querySelectorAll('button').forEach(btn => {
        if (!active) btn.disabled = true;
      });
    }
  }

  function resetSliderToStart() {
    const slider = document.getElementById('raise-slider-horiz');
    if (!slider) return;
    slider.value = slider.min;
    const mini = document.getElementById('raise-amount-mini');
    if (mini) mini.textContent = '0';
  }

  function showActions(state, heroIndex, handlers) {
    const hero = state.players[heroIndex];
    const toCall = Math.max(0, state.currentBet - hero.committedThisStreet);
    const canCheck = toCall === 0;
    const canCall  = toCall > 0 && toCall < hero.stack;
    const canRaise = hero.stack > toCall;

    setHeroActionsActive(true);

    el.btnFold.disabled = canCheck;
    el.btnCheck.disabled = !canCheck;
    el.btnCall.disabled = !canCall;

    if (canCall) {
      el.callAmount.textContent = formatChips(toCall, state);
    } else {
      el.callAmount.textContent = '';
    }

    renderQuickRaiseOptions(state, hero, toCall, null);

    if (canRaise) {
      setupHorizontalSlider(state, hero);
    }

    bindActionHandlers(state, heroIndex, toCall, handlers);
  }

  function renderQuickRaiseOptions(state, hero, toCall, forceVariant) {
    el.quickPercentList.innerHTML = '';
    if (!hero) return;

    const bb = state.blinds.bb;
    const maxTarget = hero.committedThisStreet + hero.stack;
    const minTarget = state.currentBet + state.minRaise;
    const canRaise = hero.stack > toCall && !hero.folded && !hero.eliminated && hero.stack > 0;

    let variant = forceVariant;
    if (!variant) {
      if (state.street === 'preflop' && state.currentBet === bb) variant = 'bb';
      else variant = 'percent';
    }

    let options;

    if (variant === 'bb') {
      options = [
        { label: 'ALL-IN', target: maxTarget, allin: true },
        { label: '3.5 BB', target: Math.round(bb * 3.5) },
        { label: '3 BB',   target: Math.round(bb * 3) },
        { label: '2.5 BB', target: Math.round(bb * 2.5) },
        { label: '2 BB',   target: Math.round(bb * 2) }
      ];
    } else {
      const potAfterCall = state.pot + Math.min(toCall, hero.stack);
      options = [
        { label: 'ALL-IN', target: maxTarget, allin: true },
        { label: '100%', target: Math.min(maxTarget, state.currentBet + Math.round(potAfterCall * 1.00)) },
        { label: '70%',  target: Math.min(maxTarget, state.currentBet + Math.round(potAfterCall * 0.70)) },
        { label: '50%',  target: Math.min(maxTarget, state.currentBet + Math.round(potAfterCall * 0.50)) },
        { label: '30%',  target: Math.min(maxTarget, state.currentBet + Math.round(potAfterCall * 0.30)) }
      ];
    }

    for (const opt of options) {
      let target = Math.min(maxTarget, opt.target);
      if (target < minTarget) target = Math.min(minTarget, maxTarget);
      if (target < state.currentBet) target = state.currentBet;
      if (target < bb) target = bb;

      const btn = document.createElement('button');
      if (opt.allin) {
        btn.classList.add('allin-btn');
        btn.innerHTML = `<span class="label">ALL-IN</span>`;
      } else {
        btn.innerHTML = `<span class="label">${opt.label}</span><span class="value">${formatChips(target, state)}</span>`;
      }
      btn.dataset.target = target;
      btn.disabled = !canRaise;
      el.quickPercentList.appendChild(btn);
    }
  }

  function setupHorizontalSlider(state, hero) {
    const slider = document.getElementById('raise-slider-horiz');
    el.sliderHoriz = slider;

    const minTarget = state.currentBet + state.minRaise;
    const maxTarget = hero.committedThisStreet + hero.stack;
    const realMin = Math.min(minTarget, maxTarget);
    const realMax = maxTarget;

    slider.min   = realMin;
    slider.max   = realMax;
    slider.step  = state.blinds.bb >= 100 ? 10 : 1;
    slider.value = realMin;

    updateSliderDisplay(state);
  }

  function updateSliderDisplay(state) {
    const slider = document.getElementById('raise-slider-horiz');
    el.sliderHoriz = slider;
    el.raiseAmountMini = document.getElementById('raise-amount-mini');
    el.raiseAmountMini.textContent = formatChips(Number(slider.value), state);
  }

  function bindActionHandlers(state, heroIndex, toCall, handlers) {
    rebind(el.btnFold,  () => { if (!el.heroActions.classList.contains('inactive')) handlers.onFold(); });
    rebind(el.btnCheck, () => { if (!el.heroActions.classList.contains('inactive')) handlers.onCheck(); });
    rebind(el.btnCall,  () => { if (!el.heroActions.classList.contains('inactive')) handlers.onCall(); });

    const slider = document.getElementById('raise-slider-horiz');
    el.sliderHoriz = slider;

    let startValue = Number(slider.value);
    let pressedOnThumb = false;
    let sliderDragging = false;

    function isSliderDisabled() {
      return el.heroActions.classList.contains('inactive') || slider.disabled;
    }

    function isPointOnThumb(clientX) {
      const rect = slider.getBoundingClientRect();
      const min = Number(slider.min);
      const max = Number(slider.max);
      const val = Number(slider.value);
      if (max <= min) return false;
      const thumbW = 16;
      const trackW = rect.width - thumbW;
      const ratio = (val - min) / (max - min);
      const thumbCenter = rect.left + thumbW / 2 + ratio * trackW;
      return Math.abs(clientX - thumbCenter) <= thumbW * 0.9;
    }

    slider.onpointerdown = (e) => {
      e.stopPropagation();
      if (isSliderDisabled()) { e.preventDefault(); return; }
      pressedOnThumb = isPointOnThumb(e.clientX);
      if (!pressedOnThumb) {
        e.preventDefault();
        return;
      }
      sliderDragging = true;
      startValue = Number(slider.value);
      slider.classList.add('pressed');
    };

    slider.onpointerup = (e) => {
      e.stopPropagation();
      if (!pressedOnThumb) { pressedOnThumb = false; return; }
      slider.classList.remove('pressed');
      pressedOnThumb = false;
      if (!sliderDragging) return;
      sliderDragging = false;
      if (isSliderDisabled()) return;
      const current = Number(slider.value);
      if (current === startValue) return;
      const hero = state.players[heroIndex];
      const maxTarget = hero.committedThisStreet + hero.stack;
      if (current >= maxTarget) {
        handlers.onAllIn();
      } else {
        handlers.onRaise(current);
      }
    };

    slider.onpointercancel = () => {
      slider.classList.remove('pressed');
      pressedOnThumb = false;
      sliderDragging = false;
    };

    slider.onclick = (e) => { e.preventDefault(); e.stopPropagation(); };

    slider.oninput = () => {
      if (isSliderDisabled()) return;
      updateSliderDisplay(state);
    };

    slider.ontouchstart = (e) => {
      if (isSliderDisabled()) { e.preventDefault(); return; }
      const t = e.touches && e.touches[0];
      if (!t) return;
      if (!isPointOnThumb(t.clientX)) {
        e.preventDefault();
      }
    };

    el.quickPercentList.querySelectorAll('button').forEach(btn => {
      btn.onclick = () => {
        if (el.quickPercentList.classList.contains('inactive')) return;
        if (el.heroActions.classList.contains('inactive')) return;
        handlers.onRaise(Number(btn.dataset.target));
      };
    });
  }

  function rebind(node, fn) {
    const clone = node.cloneNode(true);
    node.parentNode.replaceChild(clone, node);
    clone.addEventListener('click', fn);
    if (node.id === 'btn-fold')  el.btnFold  = clone;
    if (node.id === 'btn-check') el.btnCheck = clone;
    if (node.id === 'btn-call') {
      el.btnCall = clone;
      el.callAmount = clone.querySelector('#call-amount');
    }
  }

  function updateHistoryInfo(current, total, isViewingPast) {
    el.hnCur.textContent = current;
    el.hnTot.textContent = total;
    const hasHistory = total > 0;

    if (!isViewingPast) {
      el.hnPrev.disabled = !hasHistory;
      el.hnNext.disabled = true;
      el.hnResume.disabled = true;
    } else {
      el.hnPrev.disabled = !(hasHistory && current > 1);
      el.hnNext.disabled = !(hasHistory && current < total);
      el.hnResume.disabled = false;
    }
  }

  function applySettingsToUI() {
    el.setCardStyle.value      = settings.cardStyle;
    el.setStackDisplay.value   = settings.stackDisplay;
    el.setBlindGrowth.value    = String(settings.blindGrowthHands);
    el.setTurnTime.value       = String(settings.turnTime);
    el.setShowStrategies.checked = settings.showStrategies;
    el.setShowAllHands.checked   = settings.showAllHands;
    el.setShowAllShowdown.checked = settings.showAllShowdown;
  }

  function readSettingsFromUI() {
    settings.cardStyle         = el.setCardStyle.value;
    settings.stackDisplay      = el.setStackDisplay.value;
    settings.blindGrowthHands  = Number(el.setBlindGrowth.value);
    settings.turnTime          = Number(el.setTurnTime.value);
    settings.showStrategies    = el.setShowStrategies.checked;
    settings.showAllHands      = el.setShowAllHands.checked;
    settings.showAllShowdown   = el.setShowAllShowdown.checked;
    applyCardStyle();
    if (settings.onChange) settings.onChange(settings);
  }

  function syncSettingsUI() {
    el.setStackDisplay.value       = settings.stackDisplay;
    el.setShowStrategies.checked   = settings.showStrategies;
    el.setShowAllHands.checked     = settings.showAllHands;
    el.setShowAllShowdown.checked  = settings.showAllShowdown;
  }

  function toggleStackDisplay() {
    settings.stackDisplay = (settings.stackDisplay === 'bb') ? 'chips' : 'bb';
    syncSettingsUI();
    if (settings.onChange) settings.onChange(settings);
  }

  function toggleShowStrategies() {
    settings.showStrategies = !settings.showStrategies;
    syncSettingsUI();
    if (settings.onChange) settings.onChange(settings);
  }

  function toggleShowAllHands() {
    settings.showAllHands = !settings.showAllHands;
    syncSettingsUI();
    if (settings.onChange) settings.onChange(settings);
  }

  function clearWinnerHighlights() {
    document.querySelectorAll('.seat.winner').forEach(s => s.classList.remove('winner'));
  }

  return {
    settings, init, el,
    renderTable, updateSeats, updateBoard, updatePot, updateLevel,
    updateStacks, updateActiveHighlight,
    showActions, setHeroActionsActive,
    openBottomPanel, closeBottomPanel, closeAllPanels,
    updateHistoryInfo,
    readSettingsFromUI, applySettingsToUI,
    syncSettingsUI, toggleStackDisplay, toggleShowStrategies, toggleShowAllHands,
    createCardElement, formatChips,
    renderQuickRaiseOptions,
    clearWinnerHighlights,
    resetSliderToStart
  };

})();


/* ============================================================
   MAIN
   ============================================================ */

(() => {

  const session = {
    state: null, heroIndex: 0,
    stats: { hands: 0, hit: 0, miss: 0, place: null, streak: 0 },
    waitingForHero: false, active: false,
    heroEntered: false,
    history: [], viewingIndex: -1, autoNextTimerId: null,
    botTimerId: null, revealTimerId: null,
    isPaused: false
  };

  const el = {};

  window.addEventListener('DOMContentLoaded', () => {
    UI.init();
    cacheDom();
    bindGlobalHandlers();
    UI.applySettingsToUI();
    bindDoubleTapGuard();
  });

  function cacheDom() {
    el.btnStart       = document.getElementById('btn-start');
    el.startOverlay   = document.getElementById('start-overlay');
    el.bottomPanel    = document.getElementById('bottom-panel');
    el.tapClose       = document.getElementById('tap-close');
    el.hnPrev         = document.getElementById('hn-prev');
    el.hnNext         = document.getElementById('hn-next');
    el.hnResume       = document.getElementById('hn-resume');
    el.hnReset        = document.getElementById('hn-reset');
    el.hnSettings     = document.getElementById('hn-settings');
    el.app            = document.getElementById('app');
    el.seats          = document.getElementById('seats');
  }

  function bindDoubleTapGuard() {
    let lastTapTime = 0;
    const table = document.getElementById('poker-table');
    if (!table) return;
    table.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTapTime < 300) {
        e.preventDefault();
      }
      lastTapTime = now;
    }, { passive: false });
  }

  function isInteractiveTarget(target) {
    if (!target) return false;
    return !!(target.closest('button') ||
              target.closest('input') ||
              target.closest('select') ||
              target.closest('#bottom-panel') ||
              target.closest('#start-overlay'));
  }

  function bindGlobalHandlers() {
    el.btnStart.addEventListener('click', () => {
      el.startOverlay.classList.add('hidden');
      startNewSession();
    });

    let startX = 0, startY = 0, tracking = false;
    el.app.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      if (isInteractiveTarget(e.target)) { tracking = false; return; }
      tracking = true;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }, { passive: true });
    el.app.addEventListener('touchend', (e) => {
      if (!tracking) return;
      tracking = false;
      const endX = e.changedTouches[0].clientX;
      const endY = e.changedTouches[0].clientY;
      const dx = endX - startX;
      const dy = endY - startY;
      const minDist = 50;
      if (Math.abs(dy) < minDist) return;
      if (Math.abs(dx) > Math.abs(dy)) return;
      if (dy < 0) {
        UI.openBottomPanel();
      }
    }, { passive: true });

    el.tapClose.addEventListener('click', () => UI.closeAllPanels());

    let bpStartY = 0, bpTracking = false;
    el.bottomPanel.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      bpTracking = true;
      bpStartY = e.touches[0].clientY;
    }, { passive: true });
    el.bottomPanel.addEventListener('touchend', (e) => {
      if (!bpTracking) return;
      bpTracking = false;
      const endY = e.changedTouches[0].clientY;
      const dy = endY - bpStartY;
      if (dy > 60) UI.closeBottomPanel();
    }, { passive: true });

    ['set-card-style','set-stack-display','set-blind-growth','set-turn-time','set-show-strategies','set-show-all-hands','set-show-all-showdown'].forEach(id => {
      const node = document.getElementById(id);
      if (!node) return;
      node.addEventListener('change', () => {
        UI.readSettingsFromUI();
        if (session.state) {
          UI.updateLevel(session.state);
          UI.updateSeats(session.state, session.state.handOver);
          UI.updateBoard(session.state);
          if (session.waitingForHero) {
            refreshQuickPercentList();
            refreshCallAmount();
          }
        }
      });
    });

    el.hnPrev.addEventListener('click', () => navigateHistory(-1));
    el.hnNext.addEventListener('click', () => navigateHistory(1));
    el.hnResume.addEventListener('click', () => resumeGame());
    el.hnReset.addEventListener('click', () => restartSession());
    el.hnSettings.addEventListener('click', () => UI.openBottomPanel());

    bindSeatInteractions();
  }

  function refreshCallAmount() {
    const state = session.state;
    if (!state) return;
    const hero = state.players[session.heroIndex];
    if (!hero) return;
    const toCall = Math.max(0, state.currentBet - hero.committedThisStreet);
    const amountEl = document.getElementById('call-amount');
    if (!amountEl) return;
    const canCall = toCall > 0 && toCall < hero.stack;
    if (canCall) {
      amountEl.textContent = UI.formatChips(toCall, state);
    } else {
      amountEl.textContent = '';
    }
    const slider = document.getElementById('raise-slider-horiz');
    const mini = document.getElementById('raise-amount-mini');
    if (slider && mini) {
      mini.textContent = UI.formatChips(Number(slider.value), state);
    }
  }

  function bindSeatInteractions() {
    if (!el.seats) return;

    el.seats.addEventListener('touchend', (e) => {
      const stackEl = e.target.closest('.stack');
      const cardsEl = e.target.closest('.seat-cards');
      const now = Date.now();

      if (stackEl) {
        const last = stackEl._lastTap || 0;
        if (now - last < 300) {
          stackEl._lastTap = 0;
          e.preventDefault();
          e.stopPropagation();
          handleStackDoubleTap();
          return;
        }
        stackEl._lastTap = now;
        return;
      }

      if (cardsEl) {
        const isHeroSeat = !!cardsEl.closest('.seat.hero');
        const last = cardsEl._lastTap || 0;
        if (now - last < 300) {
          cardsEl._lastTap = 0;
          e.preventDefault();
          e.stopPropagation();
          if (isHeroSeat) {
            handleHeroCardsDoubleTap();
          } else {
            handleCardsDoubleTap();
          }
          return;
        }
        cardsEl._lastTap = now;
        return;
      }
    }, { passive: false });
  }

  function handleStackDoubleTap() {
    UI.toggleStackDisplay();
    if (session.state) {
      const state = session.state;
      const showAll = state.handOver || session.viewingIndex >= 0;
      if (session.viewingIndex >= 0) {
        UI.updateSeats(session.history[session.viewingIndex], true);
        UI.updatePot(session.history[session.viewingIndex]);
      } else {
        UI.updateSeats(state, showAll);
        UI.updatePot(state);
      }
      UI.updateLevel(session.viewingIndex >= 0 ? session.history[session.viewingIndex] : state);
      if (session.viewingIndex < 0 && session.waitingForHero) {
        refreshQuickPercentList();
        refreshCallAmount();
      }
    }
  }

  function handleCardsDoubleTap() {
    UI.toggleShowStrategies();
    if (session.state) {
      const state = session.state;
      const showAll = state.handOver || session.viewingIndex >= 0;
      if (session.viewingIndex >= 0) {
        UI.updateSeats(session.history[session.viewingIndex], true);
      } else {
        UI.updateSeats(state, showAll);
      }
    }
  }

  function handleHeroCardsDoubleTap() {
    UI.toggleShowAllHands();
    if (session.state) {
      const state = session.state;
      const showAll = state.handOver || session.viewingIndex >= 0;
      if (session.viewingIndex >= 0) {
        UI.updateSeats(session.history[session.viewingIndex], true);
      } else {
        UI.updateSeats(state, showAll);
      }
    }
  }

  function restartSession() {
    clearTimeout(session.autoNextTimerId);
    clearTimeout(session.botTimerId);
    clearTimeout(session.revealTimerId);
    session.active = false;
    session.state = null;
    session.history = [];
    session.viewingIndex = -1;
    session.stats = { hands: 0, hit: 0, miss: 0, place: null, streak: 0 };
    session.waitingForHero = false;
    session.heroEntered = false;
    session.isPaused = false;

    UI.setHeroActionsActive(false);
    UI.updateHistoryInfo(0, 0, false);
    UI.clearWinnerHighlights();

    startNewSession();
  }

  function startNewSession() {
    clearTimeout(session.autoNextTimerId);
    clearTimeout(session.botTimerId);
    clearTimeout(session.revealTimerId);
    session.active = true;
    session.stats = { hands: 0, hit: 0, miss: 0, place: null, streak: 0 };
    session.waitingForHero = false;
    session.heroEntered = false;
    session.history = [];
    session.viewingIndex = -1;
    session.isPaused = false;

    const botStrategies = Bots.assignStrategies(7);
    const players = [{ id: 'hero', name: 'Ты', isHero: true, strategy: null, stack: Engine.STARTING_STACK }];
    for (let i = 0; i < 7; i++) {
      players.push({ id: 'bot' + (i + 1), name: 'Бот ' + (i + 1), isHero: false, strategy: botStrategies[i], stack: Engine.STARTING_STACK });
    }

    session.heroIndex = 0;
    session.state = Engine.createInitialState(players);
    session.state.buttonIndex = 7;

    UI.renderTable(session.state);
    UI.updateHistoryInfo(0, 0, false);

    startHand();
  }

  function startHand() {
    if (!session.active) return;

    // Обновляем флаг "вылетел ранее" у всех мест. inHand = true будет
    // выставлено позже движком для тех, кто участвует в этой раздаче.
    for (const p of session.state.players) {
      if (!p.eliminated && p.stack <= 0) p.eliminated = true;
      p.inHand = !p.eliminated; // участвует в этой раздаче, если ещё не вылетел
    }

    const hero = session.state.players[session.heroIndex];
    if (hero.eliminated || hero.stack <= 0) { endSession('Герой вылетел'); return; }
    const alive = session.state.players.filter(p => !p.eliminated);
    if (alive.length <= 1) { endSession('Турнир выигран!'); return; }

    clearTimeout(session.revealTimerId);

    Engine.startHand(session.state);
    session.heroEntered = false;
    session.viewingIndex = -1;
    session.isPaused = false;

    UI.clearWinnerHighlights();
    UI.renderTable(session.state);
    UI.updateBoard(session.state);
    UI.updatePot(session.state);
    UI.updateSeats(session.state);
    UI.updateLevel(session.state);
    UI.updateHistoryInfo(session.history.length, session.history.length, false);

    UI.resetSliderToStart();
    refreshQuickPercentList();
    UI.setHeroActionsActive(false);
    processTurn();
  }

  function refreshQuickPercentList() {
    const state = session.state;
    if (!state) return;
    const hero = state.players[session.heroIndex];
    if (!hero) return;
    const toCall = Math.max(0, state.currentBet - hero.committedThisStreet);
    UI.renderQuickRaiseOptions(state, hero, toCall, null);
  }

  function processTurn() {
    if (session.isPaused) return;
    if (session.viewingIndex >= 0) return;
    const state = session.state;
    if (!state) return;
    if (state.handOver) { finishHand(); return; }

    const idx = state.actingIndex;
    const player = state.players[idx];
    if (!player || player.folded || player.eliminated || player.allIn) { advanceOrFinish(); return; }

    UI.updateActiveHighlight(state);

    if (player.isHero) {
      session.waitingForHero = true;
      heroTurn(player);
    } else {
      session.waitingForHero = false;
      UI.setHeroActionsActive(false);
      UI.resetSliderToStart();
      refreshQuickPercentList();
      botTurn(player, idx);
    }
  }

  function heroTurn(hero) {
    const state = session.state;
    UI.showActions(state, session.heroIndex, {
      onFold:  () => heroAct({ type: 'fold' }),
      onCheck: () => heroAct({ type: 'check' }),
      onCall:  () => heroAct({ type: 'call' }),
      onRaise: (amount) => heroAct({ type: 'raise', amount }),
      onAllIn: () => heroAct({ type: 'allin' })
    });
  }

  function heroAct(action) {
    if (session.viewingIndex >= 0) return;
    if (!session.waitingForHero) return;
    session.waitingForHero = false;
    UI.setHeroActionsActive(false);
    UI.resetSliderToStart();
    const state = session.state;
    const hero = state.players[session.heroIndex];

    if (action.type === 'call' || action.type === 'raise' || action.type === 'allin') session.heroEntered = true;

    const res = Engine.applyAction(state, session.heroIndex, action);
    if (!res.ok) {
      session.waitingForHero = true;
      heroTurn(hero);
      return;
    }

    UI.updateSeats(state);
    UI.updatePot(state);
    advanceOrFinish();
  }

  function botDecisionToEngineAction(decision) {
    return { type: decision.action, amount: decision.amount || 0 };
  }

  function botTurn(bot, idx) {
    const state = session.state;
    // Ровно два варианта: 0.5 сек или 1 сек. Случайно.
    const delay = Engine.cryptoRandomInt(2) === 0 ? 500 : 1000;
    clearTimeout(session.botTimerId);
    session.botTimerId = setTimeout(() => {
      if (session.isPaused) return;
      if (session.viewingIndex >= 0) return;
      if (state.handOver || !session.active) return;
      const ctx = buildBotContext(bot, idx);
      const decision = Bots.decide(ctx);
      const toCall = Math.max(0, state.currentBet - bot.committedThisStreet);

      let engineAction = botDecisionToEngineAction(decision);
      if (engineAction.type === 'check' && toCall > 0) engineAction = { type: 'fold', amount: 0 };

      if (engineAction.type === 'raise') {
        const minTarget = state.currentBet + state.minRaise;
        const maxTarget = bot.committedThisStreet + bot.stack;
        let target = engineAction.amount;
        if (target < minTarget) target = minTarget;
        if (target > maxTarget) target = maxTarget;
        if (target <= state.currentBet) {
          engineAction = toCall > 0 ? { type: 'call', amount: toCall } : { type: 'check', amount: 0 };
        } else engineAction.amount = target;
      }

      const res = Engine.applyAction(state, idx, engineAction);
      if (!res.ok) {
        const fallback = toCall > 0 ? { type: 'fold' } : { type: 'check' };
        Engine.applyAction(state, idx, fallback);
      }

      UI.updateSeats(state);
      UI.updatePot(state);
      UI.updateActiveHighlight(state);
      refreshQuickPercentList();
      advanceOrFinish();
    }, delay);
  }

  function buildBotContext(bot, idx) {
    const state = session.state;
    const toCall = Math.max(0, state.currentBet - bot.committedThisStreet);
    const raiser = state.lastAggressorIndex !== null ? state.players[state.lastAggressorIndex] : null;
    let facingRaise;
    if (state.street === 'preflop') facingRaise = state.currentBet > state.blinds.bb;
    else facingRaise = state.currentBet > 0;
    const facing3Bet = state.street === 'preflop' && state.currentBet > state.blinds.bb * 3;
    const facingAllin = state.players.some(p => p !== bot && !p.folded && p.allIn && p.committedThisStreet >= state.currentBet);

    return {
      card1: bot.holeCards[0], card2: bot.holeCards[1], board: state.board,
      street: state.street, pot: state.pot, toCall, minRaise: state.minRaise,
      myStack: bot.stack, bb: state.blinds.bb, position: bot.position,
      numActive: state.players.filter(p => !p.folded && !p.eliminated).length,
      facingRaise, facing3Bet, facingAllin,
      raiserPosition: raiser ? raiser.position : null,
      strategy: bot.strategy
    };
  }

  function advanceOrFinish() {
    if (session.isPaused) return;
    if (session.viewingIndex >= 0) return;
    const state = session.state;
    if (state.handOver) { finishHand(); return; }

    if (Engine.isBettingRoundComplete(state)) {
      const res = Engine.endBettingRound(state);
      UI.updateBoard(state);
      UI.updatePot(state);
      refreshQuickPercentList();
      if (res.done) { finishHand(); return; }
      UI.updateSeats(state);
      UI.updateActiveHighlight(state);
      processTurn();
      return;
    }

    const next = Engine.nextActor(state);
    if (next < 0) {
      const res = Engine.endBettingRound(state);
      UI.updateBoard(state);
      UI.updatePot(state);
      refreshQuickPercentList();
      if (res.done) { finishHand(); return; }
      UI.updateSeats(state);
      processTurn();
      return;
    }

    state.actingIndex = next;
    processTurn();
  }

  function finishHand() {
    if (session.isPaused) return;
    const state = session.state;
    Engine.finalizeHand(state);

    session.history.push(snapshotState(state));
    if (session.history.length > 1000) session.history.shift();

    UI.updateBoard(state);
    UI.updateSeats(state, false);
    UI.updatePot(state);
    UI.updateActiveHighlight(state);
    UI.setHeroActionsActive(false);
    UI.resetSliderToStart();
    refreshQuickPercentList();
    UI.updateHistoryInfo(session.history.length, session.history.length, false);

    highlightWinners(state);

    clearTimeout(session.revealTimerId);
    session.revealTimerId = setTimeout(() => {
      if (!session.state || session.state !== state) return;
      if (!state.handOver) return;
      if (session.viewingIndex >= 0) return;
      UI.updateSeats(state, true);
    }, 1000);

    clearTimeout(session.autoNextTimerId);
    session.autoNextTimerId = setTimeout(() => {
      if (!session.active) return;
      if (session.viewingIndex >= 0) return;
      if (session.isPaused) return;

      const period = UI.settings.blindGrowthHands || 10;
      state.handsAtLevel++;
      if (state.handsAtLevel >= period) {
        state.handsAtLevel = 0;
        state.levelIndex = Math.min(state.levelIndex + 1, Engine.BLIND_LEVELS.length - 1);
      }

      const heroP = state.players[session.heroIndex];
      if (heroP.eliminated || heroP.stack <= 0) { endSession('Герой вылетел'); return; }
      const alive = state.players.filter(p => !p.eliminated);
      if (alive.length <= 1) { endSession('Турнир выигран!'); return; }
      startHand();
    }, 4000);
  }

  function highlightWinners(state) {
    UI.clearWinnerHighlights();
    if (!state.showdownResults) return;
    for (const [id, amount] of Object.entries(state.showdownResults.payouts || {})) {
      if (amount <= 0) continue;
      const seat = document.getElementById(`seat-${id}`);
      if (seat) seat.classList.add('winner');
    }
  }

  function snapshotState(state) {
    return {
      handNumber: state.handNumber,
      levelIndex: state.levelIndex,
      handOver: state.handOver,
      finalStreet: state.finalStreet,
      board: state.board.map(c => ({ ...c })),
      pot: state.pot,
      buttonIndex: state.buttonIndex,
      blinds: { ...state.blinds },
      players: state.players.map(p => ({
        id: p.id, seatIndex: p.seatIndex, name: p.name, isHero: p.isHero,
        strategy: p.strategy, stack: p.stack, position: p.position,
        holeCards: p.holeCards.map(c => ({ ...c })),
        folded: p.folded, eliminated: p.eliminated, revealed: p.revealed,
        committedThisStreet: 0, acted: p.acted, lastAction: p.lastAction,
        committedTotal: p.committedTotal, blindPaid: p.blindPaid,
        // inHand фиксируем на момент снимка: если игрок не участвовал в этой
        // раздаче — его место в истории не должно отрисовываться.
        inHand: p.inHand
      })),
      showdownResults: state.showdownResults
    };
  }

  function pauseGame() {
    if (session.isPaused) return;
    session.isPaused = true;
    clearTimeout(session.botTimerId);
    clearTimeout(session.autoNextTimerId);
    session.botTimerId = null;
    session.autoNextTimerId = null;
    UI.setHeroActionsActive(false);
  }

  function navigateHistory(delta) {
    if (session.history.length === 0) return;
    if (session.viewingIndex < 0) {
      session.viewingIndex = session.history.length - 1;
      pauseGame();
    } else {
      session.viewingIndex = Math.max(0, Math.min(session.history.length - 1, session.viewingIndex + delta));
    }
    renderHistorySnapshot();
  }

  function renderHistorySnapshot() {
    const snap = session.history[session.viewingIndex];
    if (!snap) return;
    UI.setHeroActionsActive(false);
    UI.updateBoard(snap);
    UI.updateSeats(snap, true);
    UI.updatePot(snap);
    UI.updateLevel(snap);
    UI.updateActiveHighlight({ actingIndex: -1, handOver: true, players: snap.players });
    highlightWinners(snap);
    UI.updateHistoryInfo(session.viewingIndex + 1, session.history.length, true);
  }

  function resumeGame() {
    session.viewingIndex = -1;
    session.isPaused = false;
    const state = session.state;
    if (state.handOver) {
      UI.updateBoard(state);
      UI.updateSeats(state, true);
      UI.updatePot(state);
      UI.updateLevel(state);
      highlightWinners(state);
      UI.setHeroActionsActive(false);
      refreshQuickPercentList();
      if (session.autoNextTimerId === null) {
        session.autoNextTimerId = setTimeout(() => {
          if (!session.active) return;
          if (session.viewingIndex >= 0) return;
          if (session.isPaused) return;

          const period = UI.settings.blindGrowthHands || 10;
          state.handsAtLevel++;
          if (state.handsAtLevel >= period) {
            state.handsAtLevel = 0;
            state.levelIndex = Math.min(state.levelIndex + 1, Engine.BLIND_LEVELS.length - 1);
          }

          const heroP = state.players[session.heroIndex];
          if (heroP.eliminated || heroP.stack <= 0) { endSession('Герой вылетел'); return; }
          const alive = state.players.filter(p => !p.eliminated);
          if (alive.length <= 1) { endSession('Турнир выигран!'); return; }
          startHand();
        }, 4000);
      }
    } else {
      UI.clearWinnerHighlights();
      UI.updateBoard(state);
      UI.updateSeats(state);
      UI.updatePot(state);
      UI.updateLevel(state);
      UI.updateActiveHighlight(state);
      UI.resetSliderToStart();
      refreshQuickPercentList();
      if (session.waitingForHero) {
        heroTurn(state.players[session.heroIndex]);
      } else {
        UI.setHeroActionsActive(false);
        processTurn();
      }
    }
    UI.updateHistoryInfo(session.history.length, session.history.length, false);
  }

  function endSession(title) {
    session.active = false;
    clearTimeout(session.autoNextTimerId);
    clearTimeout(session.botTimerId);
    clearTimeout(session.revealTimerId);
    UI.setHeroActionsActive(false);
    const alive = session.state.players.filter(p => !p.eliminated).length;
    const heroAlive = !session.state.players[session.heroIndex].eliminated;
    session.stats.place = heroAlive ? alive : (alive + 1);
    alert(title + '\nМесто: ' + session.stats.place + '/' + Engine.SEATS +
          '\nРаздач: ' + session.stats.hands);
    el.startOverlay.classList.remove('hidden');
    el.btnStart.textContent = 'Начать заново';
  }

})();
</script>
